name: Windows smoke diagnosis (temporary)
on:
  push:
    branches: [claude/project-thread-8ct81q]
    paths: ['.github/workflows/windows-diag.yml']
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        flags: ['', '--no-sandbox', '--disable-gpu-sandbox', '--disable-gpu --disable-software-rasterizer', '--no-sandbox --disable-gpu']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - name: smoke (${{ matrix.flags }})
        shell: pwsh
        timeout-minutes: 5
        env:
          ASTRA_LAB_DATA: ${{ runner.temp }}\astra-diag
          ASTRA_LAB_SOFTWARE_RENDER: "1"
        run: |
          [System.Environment]::OSVersion.VersionString
          $exe = (node -p "require('electron')").Trim()
          $args2 = @('.', '--smoke-test') + ('${{ matrix.flags }}'.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries))
          $p = Start-Process -FilePath $exe -ArgumentList $args2 -Wait -PassThru -NoNewWindow
          Get-Content "$env:ASTRA_LAB_DATA\logs\astra-lab.log" -ErrorAction SilentlyContinue
          if (!(Select-String -Path "$env:ASTRA_LAB_DATA\logs\astra-lab.log" -Pattern 'SMOKE OK' -Quiet)) { throw "no SMOKE OK (exit $($p.ExitCode))" }
