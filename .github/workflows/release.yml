name: Release (auto-update)
# Push a tag like v2.6.0 and this builds the Windows installer and publishes it as a GitHub Release.
# Installed apps check  https://github.com/<you>/<repo>/releases/latest/download/latest.yml  (Settings > Updates).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Point the updater at this repository
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build.publish=[{provider:'generic',url:'https://github.com/${{ github.repository }}/releases/latest/download/',channel:'latest'}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
      - run: npm install
      - run: npm test
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/*.exe
            build/dist/*.blockmap
            build/dist/latest.yml
          generate_release_notes: true
